name: ci
on:
  push:
  pull_request:
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Levalicious/mk@8b33eaa94d5ae53a70b0f3b2cfd9fb1432f8cc9e
      - uses: Levalicious/mkroot@36d0977adb014e0e2775222d23ce522ddde8b570
      - run: mk
      - run: (cd stdlib && mk install)
      - run: mk test
